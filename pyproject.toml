[project]
name = "fraud-sentinel"
version = "0.1.0"
description = "Real-time card fraud detection: point-in-time feature engine, from-scratch gradient boosting, calibrated cost-sensitive decisions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "tabulate>=0.10.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs a running PostgreSQL (SENTINEL_DB_URL)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]
