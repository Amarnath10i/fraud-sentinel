# PostgreSQL + scoring API + web frontend. Build the data and model first (see README), then:
#   docker compose up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SENTINEL_DB_URL: postgresql://postgres:postgres@db:5432/sentinel
      SENTINEL_DATA_DIR: /app/data
      SENTINEL_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    ports: ["8000:8000"]

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
